<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <span>Fondi: <b id="money">-</b></span>
  <span>Strade: <b id="roads">0</b></span>
  <span>Case: <b id="houses">0</b></span>
  <span>Seed: <span id="seed">-</span></span>
  <span>Tile: <span id="info">-</span></span>
  <button id="regen">Nuovo terreno</button>
</div>

<div id="toolbar"></div>
<div id="toast"></div>

<div id="help">
  Sinistro: usa lo strumento (Mano: trascina la mappa)<br>
  Destro o centrale + trascina: muovi la mappa<br>
  Rotella: zoom | WASD o frecce: muovi<br>
  1-4: strumenti | Esc: Mano | R: nuovo terreno
</div>

<!-- L'ordine conta: ogni file usa quelli caricati prima -->
<script src="js/config.js"></script>
<script src="js/noise.js"></script>
<script src="js/terrain.js"></script>
<script src="js/game.js"></script>
<script src="js/camera.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
