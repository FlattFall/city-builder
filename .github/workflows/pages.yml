# Pubblica la versione web del gioco su GitHub Pages ad ogni modifica del ramo main.
# Serve solo per provare velocemente: basta ricaricare la pagina nel browser.
name: Versione web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tutta la storia: serve per la pagina delle versioni
      - name: Prepara i file del gioco
        run: mkdir site && cp -r index.html style.css js manifest.json icons site/
      # Ogni pubblicazione ha i suoi indirizzi (js/game.js?v=<commit>): GitHub Pages fa tenere i file al browser
      # per 10 minuti e, ricaricando, l'utente vedeva ancora il gioco di prima (anteprima dei parchi "sbagliata")
      - name: Versione nei link degli script e dello stile
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(src=\"js/[^\"?]+\.js)\"#\1?v=$V\"#g; s#(href=\"style\.css)\"#\1?v=$V\"#g" site/index.html
          grep -c "?v=$V" site/index.html
      - name: Prepara tutte le versioni (site/versioni)
        run: python3 tools/build-versions.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
