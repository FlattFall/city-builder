# Pubblica la versione web del gioco su GitHub Pages ad ogni modifica del ramo main.
# Serve solo per provare velocemente: basta ricaricare la pagina nel browser.
name: Versione web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tutta la storia: serve per la pagina delle versioni
      - name: Prepara i file del gioco
        run: mkdir site && cp -r index.html style.css js manifest.json icons site/
      - name: Prepara tutte le versioni (site/versioni)
        run: python3 tools/build-versions.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
