name: Build Windows

# Crea il programma da scaricare per Windows (installatore + versione portatile).
# Si avvia da GitHub (Actions -> Build Windows -> Run workflow) o con un tag "v...": crea la Release
# con il numero di versione di package.json (es. v0.2.0) e ci mette i file da scaricare:
# https://github.com/FlattFall/city-builder/releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Versione
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: supplyville-windows
          path: dist/*.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Supplyville ${{ steps.ver.outputs.tag }}
          files: dist/*.exe
          body: |
            **Supplyville** - city builder isometrico in stile retro.

            - **Supplyville-Setup-….exe**: installatore (icona sul desktop e nel menu Start).
            - **Supplyville-…-portable.exe**: si apre con un doppio clic, senza installare.

            Windows può mostrare "Windows ha protetto il PC": clic su *Ulteriori informazioni* → *Esegui comunque*.
